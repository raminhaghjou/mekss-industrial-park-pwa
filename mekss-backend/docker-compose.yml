services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MEKSS_LOCAL_POSTGRES_DB:-mekss}
      POSTGRES_USER: ${MEKSS_LOCAL_POSTGRES_USER:-mekss}
      POSTGRES_PASSWORD: ${MEKSS_LOCAL_POSTGRES_PASSWORD:-mekss_local_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MEKSS_LOCAL_MINIO_ROOT_USER:-mekss_local_minio}
      MINIO_ROOT_PASSWORD: ${MEKSS_LOCAL_MINIO_ROOT_PASSWORD:-mekss_local_minio_password}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: npx prisma migrate deploy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${MEKSS_LOCAL_POSTGRES_USER:-mekss}:${MEKSS_LOCAL_POSTGRES_PASSWORD:-mekss_local_password}@postgres:5432/${MEKSS_LOCAL_POSTGRES_DB:-mekss}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${MEKSS_LOCAL_BACKEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${MEKSS_LOCAL_POSTGRES_USER:-mekss}:${MEKSS_LOCAL_POSTGRES_PASSWORD:-mekss_local_password}@postgres:5432/${MEKSS_LOCAL_POSTGRES_DB:-mekss}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${MEKSS_LOCAL_JWT_SECRET:-local-development-jwt-signing-key-not-for-production}
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      SESSION_SECRET: ${MEKSS_LOCAL_SESSION_SECRET:-local-development-session-key-not-for-production}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MEKSS_LOCAL_MINIO_ROOT_USER:-mekss_local_minio}
      MINIO_SECRET_KEY: ${MEKSS_LOCAL_MINIO_ROOT_PASSWORD:-mekss_local_minio_password}
      MINIO_USE_SSL: "false"
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      KAVEH_NEGAR_API_KEY: ""
      SMS_SENDER: ${MEKSS_LOCAL_SMS_SENDER:-1000596446}
      ZARINPAL_MERCHANT_ID: ""
      ZARINPAL_CALLBACK_URL: http://localhost:3000/api/v1/invoices/payment/verify
      ZARINPAL_SANDBOX: "true"
      LOG_LEVEL: ${MEKSS_LOCAL_LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ../mekss-industrial-park
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    ports:
      - "${MEKSS_LOCAL_FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
  minio-data:
