<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/icon-96.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0f4c81" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS home-screen / standalone-mode presentation -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MEKSS" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />

    <!-- iOS launch/splash screen (portrait, common device viewport sizes) -->
    <link rel="apple-touch-startup-image" href="/icons/icon-512.png" />

    <title>پارک صنعتی MEKSS</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow-x: clip;
      }
      body {
        font-family: 'Vazirmatn', 'IRANSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f6f8fb;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        min-height: 100%;
        min-height: 100dvh;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0b1622;
        }
      }
      /* Instant app-shell splash shown until React mounts, so first paint feels native. */
      #app-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: linear-gradient(160deg, #0f4c81 0%, #0b3a63 100%);
        transition: opacity 0.25s ease;
      }
      #app-boot-splash img {
        width: 88px;
        height: 88px;
        border-radius: 20px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
      }
      #app-boot-splash span {
        color: rgba(255, 255, 255, 0.92);
        font-size: 15px;
        letter-spacing: 0.02em;
      }
      #app-boot-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-boot-splash" role="status" aria-live="polite">
      <img src="/icons/icon-192.png" alt="" width="88" height="88" />
      <span>در حال بارگذاری سامانه MEKSS...</span>
    </div>
    <script>
      // Hide the boot splash as soon as React paints anything into #root
      // (its own Suspense fallback or a rendered route), so the splash never
      // outlives real content and never flashes past a slow chunk load.
      (function () {
        var root = document.getElementById('root');
        var splash = document.getElementById('app-boot-splash');
        if (!root || !splash) return;

        var hide = function () {
          splash.classList.add('is-hidden');
          setTimeout(function () {
            splash.remove();
          }, 300);
        };

        if (root.childElementCount > 0) {
          hide();
          return;
        }

        var observer = new MutationObserver(function () {
          if (root.childElementCount > 0) {
            observer.disconnect();
            hide();
          }
        });
        observer.observe(root, { childList: true });

        // Safety fallback: never block the app shell longer than 4s even if
        // rendering stalls (e.g. offline first load without a cached shell).
        setTimeout(function () {
          observer.disconnect();
          hide();
        }, 4000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
