<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f4c81" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>اتصال برقرار نیست</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f6f8fb;
        color: #102a43;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
      }
      main { max-width: 22rem; width: 100%; }
      h1 { font-size: 1.25rem; margin: 0 0 0.75rem; }
      p { margin: 0 0 1.25rem; color: #486581; line-height: 1.6; font-size: 0.95rem; }
      button {
        background: #0f4c81;
        color: #fff;
        border: 0;
        border-radius: 0.75rem;
        padding: 0.85rem 1.25rem;
        font: inherit;
        font-weight: 600;
        min-height: 2.75rem;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>سامانه MEKSS به‌صورت آفلاین در دسترس نیست. پس از اتصال، دوباره تلاش کنید.</p>
      <button type="button" onclick="location.reload()">تلاش مجدد</button>
    </main>
  </body>
</html>
